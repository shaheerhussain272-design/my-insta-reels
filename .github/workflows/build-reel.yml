name: Build Instagram Reel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
      - name: Open Folder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fonts & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu
          pip install google-genai gTTS moviepy

      - name: Generate Reel with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python make_reel.py

      - name: Save Reel to GitHub Folder
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Reel Bot"
          git add reels/
          git commit -m "New Instagram Reel generated" || exit 0
          git push
